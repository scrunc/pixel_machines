# Chunk Collector custom sell prices (SmartSpawner item_prices.yml format).
# Used per the collector's economy.price_source_mode (SHOP_PRIORITY → EconomyShopGUI
# first, these as fallback). Key = MATERIAL, value = price each. Items without an
# entry fall back to economy.custom_prices.default_price (0 = don't sell it).
# Seed values below cover common farm/grind drops a vacuum picks up — tune freely.
prices:
  # ── blocks / building (low value, high volume) ──
  COBBLESTONE: 0.2
  COBBLED_DEEPSLATE: 0.2
  DIRT: 0.1
  GRAVEL: 0.2
  SAND: 0.2
  NETHERRACK: 0.1
  STONE: 0.3
  ANDESITE: 0.2
  DIORITE: 0.2
  GRANITE: 0.2

