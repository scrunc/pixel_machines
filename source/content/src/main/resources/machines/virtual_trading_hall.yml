# Virtual Trading Hall (ADR 0011) — capture villagers, build profession stations,
# and run a sealed, paginated trading operation. T1 ships a placeholder stall model;
# the proper build comes later. Blocks are corner-anchored (a part fills
# [offset, offset+scale]; centre with offset = -scale/2). Column axis x=z=0.5.
id: virtual_trading_hall
anchor: barrel

# ── palette (tweak freely, then /mc reload) ──
vars:
  plinth: polished_deepslate    # central base box
  trim:   cut_copper            # base cap / accents
  grate:  copper_grate          # hatched platform lid
  dial:   lodestone             # spinning gear / dial
  gem:    emerald_block         # blinking gem
  stone:  chiseled_deepslate    # orbiting obelisks

placer:
  item: emerald
  name: "<dark_aqua>✦ <gradient:#33d6c0:#7fffd4><bold>Virtual Trading Hall</bold></gradient> ✦"
  lore:
    - "<gray>Right-click a block face to build."
    - "<dark_gray>Break it to pick it back up (keeps everything)."

# ── model: a 3×3 trading hall — big central plinth + grate platform + spinning
#    dial + blinking diamond emerald, ringed by TWO counter-rotating pairs of
#    obelisks (TOP pair clockwise, BOTTOM pair counter-clockwise, different clocks).
#    Visual footprint ≈ 3×3 around the single anchor block — place with clearance.
#    Offsets are first-pass — tweak live with /mc reload.
model:
  parts:
    hall:
      offset: [0.5, 0.0, 0.5]
      parts:
        base:    { block: "${plinth}", offset: [-0.80, 0.0, -0.80], scale: [1.60, 1.30, 1.60] }
        baseCap: { block: "${trim}",   offset: [-0.90, 1.28, -0.90], scale: [1.80, 0.10, 1.80] }
        lid:     { block: "${grate}",  offset: [-1.00, 1.40, -1.00], scale: [2.00, 0.10, 2.00] }
        gear:
          block: "${dial}"
          offset: [-0.25, 1.50, -0.25]
          scale: [0.50, 0.22, 0.50]
          center: true
          animation: { always: { spin: { axis: y, speed: 120 } } }
        gem:
          block: "${gem}"
          offset: [-0.35, 1.95, -0.35]
          scale: [0.70, 0.70, 0.70]
          center: true
          rotation: [0, 0, 45]
          animation: { always: { pulse: { from: 0.6, to: 1.18, period: 1.1 } } }
        ringTop:
          offset: [0.0, 0.0, 0.0]
          animation: { always: { spin: { axis: y, speed: 26 } } }
          parts:
            t1: { rotation: [45,  0, 0], parts: { ob: { block: "${stone}", offset: [-0.20, 0.55, 1.15], scale: [0.40, 2.40, 0.40], rotation: [0, -16, 0] } } }
            t2: { rotation: [225, 0, 0], parts: { ob: { block: "${stone}", offset: [-0.20, 0.55, 1.15], scale: [0.40, 2.40, 0.40], rotation: [0, -16, 0] } } }
        ringBot:
          offset: [0.0, 0.0, 0.0]
          animation: { always: { spin: { axis: y, speed: -20 } } }
          parts:
            b1: { rotation: [135, 0, 0], parts: { ob: { block: "${stone}", offset: [-0.20, 0.00, 1.15], scale: [0.40, 2.00, 0.40], rotation: [0, -12, 0] } } }
            b2: { rotation: [315, 0, 0], parts: { ob: { block: "${stone}", offset: [-0.20, 0.00, 1.15], scale: [0.40, 2.00, 0.40], rotation: [0, -12, 0] } } }

